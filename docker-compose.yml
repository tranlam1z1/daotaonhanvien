name: educore36

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: educore36
      POSTGRES_PASSWORD: educore36
      POSTGRES_DB: educore36
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U educore36 -d educore36']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: educore36
      MINIO_ROOT_PASSWORD: educore36-local-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes:
  postgres_data:
  redis_data:
  minio_data:
